name: Android 测试构建

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-test:
    name: 构建测试 APK
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://mini-notes.pages.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets and sync Capacitor
        run: pnpm android:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare test artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-files
          cp android/app/build/outputs/apk/debug/app-debug.apk test-files/Mini-Notes-测试版.apk
          sha256sum test-files/Mini-Notes-测试版.apk > test-files/Mini-Notes-测试版-SHA256.txt

      - name: Upload APK test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Notes-安卓测试版-${{ github.run_number }}
          path: test-files/
          if-no-files-found: error
          retention-days: 30
